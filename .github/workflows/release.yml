# Builds the Windows, Mac and Android keyboards and puts them on a GitHub
# release, so that windows/setup.ps1 and macos/install.sh can install them
# without Rust, and phones can download BunnyKeyboard-android.apk.
#
# To make a release: git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (for example v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build khmer_tsf.dll
        run: cargo build --release --locked -p khmer-windows

      - name: Write the version into install.ps1
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $script = Get-Content windows/install.ps1 -Raw
          $marked = "`$Version = 'dev'"
          if (-not $script.Contains($marked)) { throw "install.ps1 has no $marked to replace" }
          $script.Replace($marked, "`$Version = '$version'") | Set-Content windows/install.ps1 -NoNewline -Encoding utf8NoBOM

      - name: Put it on the release
        shell: pwsh
        run: |
          $files = 'target/release/khmer_tsf.dll', 'windows/install.ps1', 'windows/setup.ps1', 'windows/my-words.ps1'
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "Bunny Keyboard $env:TAG" --generate-notes @files
          } else {
            gh release upload $env:TAG --clobber @files
          }

  mac:
    # After the Windows job, which makes the release.
    needs: windows
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and test BunnyKeyboard.app
        run: VERSION="${TAG#v}" macos/build.sh --test

      - name: Put it on the release
        run: |
          cp macos/install.sh target/macos/install-mac.sh
          gh release upload "$TAG" --clobber target/macos/BunnyKeyboard-mac.zip target/macos/install-mac.sh

  android:
    # After the Windows job, which makes the release.
    needs: windows
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the NDK and the Rust Android targets
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Test and build the app
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease "-PbunnyVersion=${TAG#v}"

      - name: Put it on the release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk BunnyKeyboard-android.apk
          gh release upload "$TAG" --clobber BunnyKeyboard-android.apk
