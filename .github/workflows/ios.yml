# Builds and tests the iPhone keyboard on every push that touches it, on one
# of GitHub's Macs, then runs it in the iPhone Simulator and takes pictures.
# Kept with the run for 14 days (Summary > Artifacts): BunnyKeyboard-ios (the
# .ipa, to sign and install on a phone) and ios-screenshots.
name: iPhone keyboard

on:
  push:
    paths:
      - 'ios/**'
      - 'macos/Sources/Engine.swift'
      - 'macos/Sources/Session.swift'
      - 'macos/Sources/khmer.h'
      - 'crates/khmer-core/**'
      - 'crates/khmer-macos/**'
      - 'Cargo.lock'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, test, and run in the Simulator
        run: |
          set -o pipefail
          ios/build.sh --test --screenshot 2>&1 | tee build.log

      # The errors as one annotation on the run, which can be read without
      # signing in to GitHub (the full log needs a sign-in).
      - name: Show the errors
        if: failure()
        run: |
          { grep -E "error:|FAIL|Undefined symbol|ld: " build.log | head -40; echo "--- last lines:"; tail -15 build.log; } > errors.txt
          echo "::error title=iPhone build::$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')"

      - uses: actions/upload-artifact@v4
        with:
          name: BunnyKeyboard-ios
          path: target/ios/BunnyKeyboard-ios.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: target/ios/screenshot-*.png
          if-no-files-found: ignore
          retention-days: 14
